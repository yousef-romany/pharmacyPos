[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.0", features = ["dialog-all", "custom-protocol"] }
chrono = "0.4"

[patch.crates-io]
# Pin dependencies to avoid edition2024 requirement (not available in Rust 1.75.0)
home = { git = "https://github.com/rentpath/home", tag = "v0.5.5" }
getrandom = { git = "https://github.com/rust-random/getrandom", tag = "v0.2.15" }
time = { git = "https://github.com/time-rs/time", tag = "0.3.23" }
windows-sys = { git = "https://github.com/microsoft/windows-rs", tag = "0.52.0" }
windows-registry = { git = "https://github.com/microsoft/windows-rs", tag = "0.52.0" }
rustls = { git = "https://github.com/rustls/rustls", tag = "v/0.21.12" }
rustls-webpki = { git = "https://github.com/rustls/webpki", tag = "v0.101.7" }
webpki-roots = { git = "https://github.com/rustls/webpki-roots", tag = "v0.25.4" }
# Additional commonly problematic crates
ignore = { git = "https://github.com/BurntSushi/ignore", tag = "0.4.22" }
indexmap = { git = "https://github.com/bluss/indexmap", tag = "1.9.3" }
regex = { git = "https://github.com/rust-lang/regex", tag = "1.10.5" }
bstr = { git = "https://github.com/BurntSushi/bstr", tag = "1.9.0" }
globset = { git = "https://github.com/BurntSushi/ripgrep", tag = "0.4.14" }
walkdir = { git = "https://github.com/BurntSushi/walkdir", tag = "2.5.0" }
serde_derive = { git = "https://github.com/serde-rs/serde", tag = "v1.0.203" }
quote = { git = "https://github.com/dtolnay/quote", tag = "1.0.37" }
syn = { git = "https://github.com/dtolnay/syn", tag = "2.0.79" }
proc-macro2 = { git = "https://github.com/dtolnay/proc-macro2", tag = "1.0.86" }

[dependencies.tauri-plugin-sql]
git = "https://github.com/tauri-apps/plugins-workspace"
branch = "v1"
features = ["mysql"]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
