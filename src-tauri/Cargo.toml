[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.0", features = ["dialog-all", "custom-protocol"] }
chrono = "0.4"
# Pin to pre-ProcessPrng version (Windows 10+ only API)
getrandom = "=0.2.11"
# Pin to pre-edition2024 versions (Rust 1.77.2 can't parse edition2024 manifests)
ignore = ">=0.4, <0.4.25"
globset = ">=0.4, <0.4.18"

[dependencies.tauri-plugin-sql]
git = "https://github.com/tauri-apps/plugins-workspace"
branch = "v1"
features = ["mysql"]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
