[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.0", features = ["dialog-all", "custom-protocol"] }
chrono = "0.4"
# Pin dependencies to avoid edition2024 requirement (not available in Rust 1.75.0)
home = "0.5.5"
getrandom = "0.2"
windows-sys = "0.52"
windows-registry = "0.2"
time = "0.3.23"
rustls = "0.21"
rustls-webpki = "0.101"
webpki-roots = "0.25"
schannel = "0.1"
winapi = "0.3"
windows = "0.51"

[dependencies.tauri-plugin-sql]
git = "https://github.com/tauri-apps/plugins-workspace"
branch = "v1"
features = ["mysql"]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
