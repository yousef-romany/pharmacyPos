name: Windows 32-bit Build

on:
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: i686-pc-windows-msvc

      - name: Build ProcessPrng shim DLL (Windows 7 compatibility)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd src-tauri\shim
          cl /LD /Fe:..\bcryptprimitives.dll processprng_shim.c bcrypt.lib /link /DEF:bcryptprimitives.def /MACHINE:X86

      - name: Install dependencies
        run: bun install

      - name: Build for Windows 32-bit
        run: bun tauri build --target i686-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyPos-Windows-32bit
          path: src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
