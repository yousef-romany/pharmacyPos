name: Windows 32-bit Build

on:
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: i686-pc-windows-msvc

      - name: Install vcpkg and MySQL client
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install libmysql:x86-windows
        shell: cmd

      - name: Install dependencies
        run: bun install

      - name: Build for Windows 32-bit
        run: bun tauri build --target i686-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x86-windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyPos-Windows-32bit
          path: src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
